[build-system]
requires = ["setuptools==75.6.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sakurapool"
version = "0.1.0"
description = "Small-data reference query and model contracts for SakuraPool"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyarrow==18.1.0", "numpy==2.2.6", "pyroaring==1.1.0"]

[project.optional-dependencies]
dev = ["build==1.2.2.post1", "pytest==8.3.4", "ruff==0.9.2"]
remote = ["requests==2.32.5", "modelscope-hub==0.4.0"]

[project.scripts]
sakurapool = "sakurapool.cli:main"
sakura = "sakurapool.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
