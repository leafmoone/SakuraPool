[workspace]
resolver = "2"
members = ["crates/sakurapool-r1"]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.dev.package.sha2]
opt-level = 2
