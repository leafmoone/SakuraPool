[package]
name = "sakurapool-rust"
version = "0.1.0"
edition = "2021"
license = "MIT"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
reqwest = { version = "=0.12.28", default-features = false, features = ["blocking", "rustls-tls"] }

[[bin]]
name = "sakurapool-worker"
path = "src/bin/worker.rs"

[profile.release]
codegen-units = 1
lto = "thin"

[profile.dev.package.sha2]
opt-level = 2
